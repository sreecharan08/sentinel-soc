<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Sentinel SOC</title>
  <link rel="stylesheet" href="{% load static %}{% static 'soc.css' %}">
</head>
<body class="login-body">
  <main class="login-card" id="main">
    <div class="login-card__mark" aria-hidden="true">&#9671;</div>
    <h1>Sentinel SOC</h1>
    <p class="muted">Sign in to continue</p>
    {% if form.errors %}
      <div class="banner banner--error" role="alert">Wrong username or password.</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}" class="stack">
      {% csrf_token %}
      <label class="field"><span>Username</span>
        <input class="input" type="text" name="username" autocomplete="username" autofocus required></label>
      <label class="field"><span>Password</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn--primary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
